site_name: Žitná Apartment
site_author: kesano.cz

theme:
  name: material
  logo: public/logo.webp
  favicon: public/favicon.ico
  palette:
    - scheme: default
      primary: white
      accent: custom
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search:
      separator: '[\s\u200b\-\.,!=\[\]()"`/]+'
  - minify:
      minify_html: true

extra:
  generator: false